name: "One-time generate Avito square preview, no autoload or other images"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/avito-square-preview-once-20261124.yml']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Create faithful square card with untouched original pixels
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance, ImageDraw
          from pathlib import Path
          import hashlib
          src=Path('avito-assets/2026-11-24/01_ves_stoit_online.jpg')
          dst=Path('avito-assets/2026-11-24/01_ves_stoit_square_PREVIEW.jpg')
          im=Image.open(src).convert('RGB')
          W,H=im.size
          print('SOURCE',W,H,'SHA',hashlib.sha256(src.read_bytes()).hexdigest()[:20])
          if W/H<1.20 or W/H>1.6:raise RuntimeError('Unexpected original aspect')
          size=max(W,H)
          y=(size-H)//2
          # Extend existing top and bottom border tones using blurred reflected
          # strips. Never crop, scale, repaint, or change a pixel of original.
          canvas=Image.new('RGB',(size,size))
          top=im.crop((0,0,W,min(230,H))).transpose(Image.Transpose.FLIP_TOP_BOTTOM)
          bottom=im.crop((0,H-min(230,H),W,H)).transpose(Image.Transpose.FLIP_TOP_BOTTOM)
          top=top.resize((size,y),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(28))
          bottom=bottom.resize((size,size-H-y),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(28))
          if y:canvas.paste(ImageEnhance.Brightness(top).enhance(.65),(0,0))
          canvas.paste(im,(0,y))
          if size-H-y:canvas.paste(ImageEnhance.Brightness(bottom).enhance(.61),(0,y+H))
          canvas.save(dst,format='JPEG',quality=95,subsampling=0,optimize=True)
          output=Image.open(dst)
          assert output.size==(size,size)
          # Lossy JPEG can alter RGB by rounding; original image geometry remains pixel-identical.
          assert dst.stat().st_size>150000
          print('PREVIEW_SAVED',dst,'DIMENSIONS',output.size,'SIZE',dst.stat().st_size)
          PY
      - name: Commit only separate preview file, never source or configured XLSX
        run: |
          test -f avito-assets/2026-11-24/01_ves_stoit_square_PREVIEW.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avito-assets/2026-11-24/01_ves_stoit_square_PREVIEW.jpg
          git commit -m "assets(avito): square cover preview preserving original design, NOT active in feeds"
          git push origin HEAD:main
