name: Journal mirror initial snapshot
on:
  push:
    branches: [journal-public-mirror]
    paths:
      - '.github/journal-migration-manifest.json'
      - '.github/workflows/journal-mirror-initial.yml'
      - '.github/scripts/journal_mirror_initial.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: journal-mirror-initial
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/journal-public-mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 .github/scripts/journal_mirror_initial.py
      - name: Save verified snapshot to isolated branch
        run: |
          git config user.name "Journal mirror"
          git config user.email "journal-mirror@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import byte-verified public journal snapshot"
          git push origin HEAD:refs/heads/journal-public-mirror
