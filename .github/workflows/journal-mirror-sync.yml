name: Journal mirror and Pages delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/journal-mirror-sync.yml'
      - '.github/scripts/journal_mirror_sync.py'
  schedule:
    - cron: '5 5 * * *'
    - cron: '50 12,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: journal-mirror-production
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 .github/scripts/journal_mirror_sync.py
      - name: Save verified public release
        run: |
          git config user.name "Journal mirror"
          git config user.email "journal-mirror@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified journal public release"
            git push origin HEAD:refs/heads/main
          fi
      - name: Request Pages build and verify deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" || true)
          if ! jq -e --arg sha "$expected" '.commit==$sha and .status=="built"' <<<"$latest" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
          for i in $(seq 1 36); do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" || true)
            if jq -e --arg sha "$expected" '.commit==$sha and .status=="built"' <<<"$latest" >/dev/null; then break; fi
            if jq -e --arg sha "$expected" '.commit==$sha and .status=="errored"' <<<"$latest" >/dev/null; then exit 1; fi
            sleep 10
          done
          jq -e --arg sha "$expected" '.commit==$sha and .status=="built"' <<<"$latest" >/dev/null
          host=xn--c1ajamhiblrj0b.online
          for path in journal-release.txt index.html articles/index.html roulette/index.html; do
            curl --fail --silent --show-error --retry 4 --retry-delay 5 --resolve "$host:443:185.199.108.153" "https://$host/$path" -o "$RUNNER_TEMP/actual"
            cmp "$path" "$RUNNER_TEMP/actual"
          done
          echo "GitHub Pages origin verified byte-for-byte, with TLS."
