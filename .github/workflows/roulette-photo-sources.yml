name: Retrieve verified Commons recipe photos
on:
  push:
    branches: [repair/roulette-photo-sources]
    paths: ['.github/workflows/roulette-photo-sources.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install Pillow
      - run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request, re, html, io, time
          from PIL import Image, ImageOps
          candidates = {
            "u-seekh-kebab": ["Seekh kebab.jpg","Vivid mongoose", "CC0"],
            "u-masala-dosa": ["Masala Dosa 2023.jpg","Yakshitha","CC BY-SA 4.0"],
            "u-french-onion-soup": ["Soupe à l'oignon.jpg","Ludovic Péron","CC BY-SA 3.0"],
            "u-carimanola": ["Barranquilla - Carimañolas.jpg","Jdvillalobos","CC BY 3.0"],
            "u-khao-soi": ["Chiang Mai - Khao Soi Khun Yai - ข้าวซอยคุณยาย เชียงใหม่ (2026) - IMG 05.jpg","Chainwit.","CC BY 4.0"],
          }
          root=pathlib.Path("verified-recipe-photos")
          root.mkdir(exist_ok=True)
          def fetch(url, maxsize=20*1024*1024):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"NatalyaRecipePhotoReview/1.0 (https://github.com/cheloveck4-netizen/cheloveck4-netizen.github.io; recipe photo source verification)"})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          data=r.read(maxsize+1)
                          if len(data)>maxsize:raise ValueError("Too large")
                          return data
                  except Exception:
                      if attempt==2:raise
                      time.sleep(3*(attempt+1))
          def clean(s):return html.unescape(re.sub(r"<[^>]*>","",s)).strip()
          out={}
          for ident,(filename,author,license) in candidates.items():
              try:
                  q=urllib.parse.urlencode({"action":"query","titles":"File:"+filename,"prop":"imageinfo","iiprop":"url|extmetadata|sha1","iiurlwidth":"720","format":"json","formatversion":"2"})
                  p=json.loads(fetch("https://commons.wikimedia.org/w/api.php?"+q))["query"]["pages"][0]
                  info=p["imageinfo"][0]; meta=info["extmetadata"]
                  actual=clean(meta["Artist"]["value"]); lic=clean(meta["LicenseShortName"]["value"])
                  assert author.casefold() in actual.casefold(),(actual,author)
                  assert lic.casefold()==license.casefold() or (license=="CC0" and lic.startswith("CC0")),(lic,license)
                  link=meta["LicenseUrl"]["value"]
                  assert link.startswith(("https://creativecommons.org/","http://creativecommons.org/"))
                  src=info.get("thumburl",info["url"])
                  assert urllib.parse.urlsplit(src).hostname=="upload.wikimedia.org"
                  raw=fetch(src)
                  im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
                  im.thumbnail((720,720),Image.Resampling.LANCZOS)
                  dest=root/(ident+".webp")
                  im.save(dest,"WEBP",quality=82,method=6)
                  out[ident]={"file":dest.name,"sha256":hashlib.sha256(dest.read_bytes()).hexdigest(),"credit":author,"creditUrl":info["descriptionurl"],"license":license,"licenseUrl":link.replace("http://","https://",1),"width":im.width,"height":im.height,"original":info["url"],"review":"matched-original","contentMatch":True}
                  print("VERIFIED",ident,lic,actual,flush=True)
              except Exception as e:
                  print("SKIP",ident,repr(e),flush=True)
              time.sleep(2)
          (root/"manifest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          assert out,"No verified photos"
          PY
      - run: |
          git config user.name "Recipe photo review"
          git config user.email "recipe-photo-review@users.noreply.github.com"
          git add verified-recipe-photos
          git commit -m "Store verified Commons photo derivatives and attribution"
          git push origin HEAD:refs/heads/repair/roulette-photo-sources
